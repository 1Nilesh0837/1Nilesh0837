<svg xmlns="http://www.w3.org/2000/svg" width="400" height="195" viewBox="0 0 400 195" fill="none">
<defs>
  <pattern id="grid-1" width="18" height="18" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="0.8" fill="#1E3A5F" opacity="0.45"/>
  </pattern>
  <linearGradient id="top-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00FF9F" stop-opacity="0.95"/>
    <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.85"/>
    <stop offset="100%" stop-color="#A855F7" stop-opacity="0.6"/>
  </linearGradient>
  <linearGradient id="laser-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00FF9F" stop-opacity="0"/>
    <stop offset="50%" stop-color="#00FF9F" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#00FF9F" stop-opacity="0"/>
  </linearGradient>
  <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <style>
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.25; transform: scale(0.85); }
    }
    @keyframes scan-beam {
      0% { transform: translateY(0px); opacity: 0; }
      15% { opacity: 0.7; }
      85% { opacity: 0.7; }
      100% { transform: translateY(195px); opacity: 0; }
    }
    .pulse-dot { animation: pulse-dot 1.8s infinite ease-in-out; transform-origin: 26px 24px; }
    .scan-line { animation: scan-beam 4s infinite linear; }
    .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 800; }
    .txt-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 450; fill: #94A3B8; }
    .txt-meta { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 800; letter-spacing: 0.8px; }
  </style>
</defs>
<rect x="1" y="1" width="398" height="193" rx="12" fill="#0A101F" stroke="#1E3A5F" stroke-width="1.2"/>
<rect x="1" y="1" width="398" height="193" rx="12" fill="url(#grid-1)" opacity="0.6"/>
<rect x="12" y="1" width="376" height="2.5" rx="1" fill="url(#top-grad-1)"/>
<line class="scan-line" x1="4" y1="0" x2="396" y2="0" stroke="url(#laser-grad-1)" stroke-width="2"/>
<rect x="16" y="14" width="134" height="20" rx="10" fill="#00FF9F1A" stroke="#00FF9F" stroke-width="0.8"/>
<circle class="pulse-dot" cx="26" cy="24" r="3.5" fill="#00FF9F"/>
<text class="txt-meta" x="35" y="27.5" fill="#00FF9F">LATEST RELEASE</text>
<text class="txt-meta" x="382" y="27.5" text-anchor="end" fill="#FFD700">★ 0 STARS &#160;<tspan fill="#38BDF8">⚡ VERIFIED</tspan></text>
<text class="txt-title" x="16" y="56" fill="#FFFFFF">
  <tspan fill="#00FF9F">🌿 </tspan>ECOFORENSICS
</text>
<text class="txt-body" x="16" y="78">
  <tspan x="16" dy="0">EcoForensics is an AI-powered resource</tspan>
  <tspan x="16" dy="18">intelligence system that detects invisible</tspan>
  <tspan x="16" dy="18">energy, water, and fuel waste from video an...</tspan>
</text>
