<rect x="16" y="161" width="62" height="22" rx="4" fill="#131D31" stroke="#F97316" stroke-width="0.8"/>
<circle cx="26" cy="172" r="3" fill="#F97316"/>
<text class="txt-meta" x="34" y="175" fill="#F97316">HTML</text>
<rect x="274" y="159" width="110" height="25" rx="5" fill="#00FF9F1A" stroke="#00FF9F" stroke-width="1"/>
<text class="txt-meta" x="329" y="175" text-anchor="middle" fill="#00FF9F">VIEW REPO →</text>
</svg>
