<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00FF9C" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'Fira Code', Consolas, 'Courier New', monospace; }
    .node-title { fill: #F8FAFC; font-size: 11.5px; font-weight: 700; letter-spacing: 0.8px; }
    .node-sub { fill: #94A3B8; font-size: 9.5px; }
    .pulse-line {
      stroke-dasharray: 6, 6;
      animation: dash 1.5s linear infinite;
    }
    @keyframes dash {
      to { stroke-dashoffset: -24; }
    }
    .accent-cyan { fill: #00F5FF; }
    .accent-purple { fill: #8B5CF6; }
    .accent-green { fill: #00FF9C; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="796" height="116" rx="10" fill="#05070D" stroke="url(#pipeBorder)" stroke-width="1.5"/>

  <!-- Top Title -->
  <text x="24" y="24" class="font-mono" fill="#00F5FF" font-size="11" font-weight="700" letter-spacing="1">VISION_PIPELINE // REAL-TIME SPATIAL REASONING ENGINE</text>
  <circle cx="765" cy="20" r="4" fill="#00FF9C" filter="url(#neon)"/>
  <text x="752" y="24" text-anchor="end" class="font-mono" fill="#00FF9C" font-size="10" font-weight="600">60 FPS STREAM</text>

  <!-- Node 1: Video Input -->
  <g transform="translate(24, 40)">
    <rect width="125" height="58" rx="8" fill="#0F172A" stroke="#00F5FF" stroke-width="1.2"/>
    <text x="62" y="25" text-anchor="middle" class="font-mono node-title" fill="#00F5FF">01 // VIDEO</text>
    <text x="62" y="44" text-anchor="middle" class="font-mono node-sub">4K / CCTV / Drone</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <line x1="151" y1="69" x2="178" y2="69" stroke="#00F5FF" stroke-width="2" class="pulse-line"/>
  <polygon points="178,65 186,69 178,73" fill="#00F5FF"/>

  <!-- Node 2: Detection -->
  <g transform="translate(188, 40)">
    <rect width="125" height="58" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="62" y="25" text-anchor="middle" class="font-mono node-title" fill="#38BDF8">02 // DETECTION</text>
    <text x="62" y="44" text-anchor="middle" class="font-mono node-sub">YOLOv8 / DeepLab</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <line x1="315" y1="69" x2="342" y2="69" stroke="#8B5CF6" stroke-width="2" class="pulse-line"/>
  <polygon points="342,65 350,69 342,73" fill="#8B5CF6"/>

  <!-- Node 3: Tracking -->
  <g transform="translate(352, 40)">
    <rect width="125" height="58" rx="8" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.2"/>
    <text x="62" y="25" text-anchor="middle" class="font-mono node-title" fill="#A78BFA">03 // TRACKING</text>
    <text x="62" y="44" text-anchor="middle" class="font-mono node-sub">DeepSORT / OpticalFlow</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <line x1="479" y1="69" x2="506" y2="69" stroke="#8B5CF6" stroke-width="2" class="pulse-line"/>
  <polygon points="506,65 514,69 506,73" fill="#8B5CF6"/>

  <!-- Node 4: Spatial Analysis -->
  <g transform="translate(516, 40)">
    <rect width="125" height="58" rx="8" fill="#0F172A" stroke="#06B6D4" stroke-width="1.2"/>
    <text x="62" y="25" text-anchor="middle" class="font-mono node-title" fill="#22D3EE">04 // SPATIAL</text>
    <text x="62" y="44" text-anchor="middle" class="font-mono node-sub">Homography / 3D Box</text>
  </g>

  <!-- Connector 4 -> 5 -->
  <line x1="643" y1="69" x2="670" y2="69" stroke="#00FF9C" stroke-width="2" class="pulse-line"/>
  <polygon points="670,65 678,69 670,73" fill="#00FF9C"/>

  <!-- Node 5: Insight -->
  <g transform="translate(680, 40)">
    <rect width="96" height="58" rx="8" fill="#0F172A" stroke="#00FF9C" stroke-width="1.2"/>
    <text x="48" y="25" text-anchor="middle" class="font-mono node-title" fill="#00FF9C">05 // INSIGHT</text>
    <text x="48" y="44" text-anchor="middle" class="font-mono node-sub">Tactics / Alert</text>
  </g>
</svg>