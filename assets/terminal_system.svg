<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="100%" height="100%">
  <defs>
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00FF9C" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1" opacity="0.15" />
    </pattern>
  </defs>

  <style>
    .font-mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; }
    .prompt { fill: #00F5FF; font-weight: 700; font-size: 13.5px; }
    .cmd { fill: #F8FAFC; font-size: 13.5px; }
    .title-sys { fill: #00FF9C; font-weight: 700; font-size: 13px; letter-spacing: 1px; }
    .label { fill: #94A3B8; font-size: 13px; font-weight: 600; }
    .val { fill: #F1F5F9; font-size: 13px; font-weight: 500; }
    .highlight { fill: #00F5FF; font-weight: 600; }
    .pulse-dot {
      animation: pulse 1.8s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { r: 4.5px; opacity: 1; filter: drop-shadow(0 0 2px #00FF9C); }
      50% { r: 6px; opacity: 0.7; filter: drop-shadow(0 0 6px #00FF9C); }
      100% { r: 4.5px; opacity: 1; filter: drop-shadow(0 0 2px #00FF9C); }
    }
    .cursor {
      animation: blink 1s infinite steps(1);
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- Outer Card with Glowing Border -->
  <rect x="2" y="2" width="796" height="336" rx="12" fill="#05070D" stroke="url(#termBorder)" stroke-width="1.8"/>
  
  <!-- Header Bar -->
  <rect x="2" y="2" width="796" height="38" rx="12" fill="url(#headerGrad)"/>
  <rect x="2" y="28" width="796" height="12" fill="#1E293B"/>
  <line x1="2" y1="40" x2="798" y2="40" stroke="#334155" stroke-width="1"/>

  <!-- Window Buttons -->
  <circle cx="22" cy="20" r="5.5" fill="#EF4444"/>
  <circle cx="38" cy="20" r="5.5" fill="#F59E0B"/>
  <circle cx="54" cy="20" r="5.5" fill="#10B981"/>

  <!-- Header Title -->
  <text x="400" y="25" text-anchor="middle" class="font-mono" fill="#94A3B8" font-size="12" letter-spacing="0.5">nilesh@neural-core: ~/system/init</text>
  <text x="770" y="25" text-anchor="end" class="font-mono" fill="#00FF9C" font-size="11" font-weight="600">[ SYSTEM ONLINE ]</text>

  <!-- Scanline texture -->
  <rect x="3" y="41" width="794" height="294" fill="url(#scanlines)" pointer-events="none"/>

  <!-- Terminal Content -->
  <!-- Line 1: Command -->
  <text x="28" y="70" class="font-mono prompt">nilesh@github:~$</text>
  <text x="175" y="70" class="font-mono cmd">./initialize_profile --mode=production</text>

  <!-- System Banner -->
  <text x="28" y="100" class="font-mono title-sys" filter="url(#glow)">[ SYSTEM STATUS: ALL CORES OPERATIONAL ]</text>

  <!-- Specifications Block -->
  <text x="28" y="130" class="font-mono label">NAME</text>
  <text x="145" y="130" class="font-mono label">:</text>
  <text x="165" y="130" class="font-mono val" font-weight="700">Nilesh Sahoo</text>

  <text x="28" y="156" class="font-mono label">ROLE</text>
  <text x="145" y="156" class="font-mono label">:</text>
  <text x="165" y="156" class="font-mono val highlight">AI / ML Engineer</text>

  <text x="28" y="182" class="font-mono label">CORE FOCUS</text>
  <text x="145" y="182" class="font-mono label">:</text>
  <text x="165" y="182" class="font-mono val">Computer Vision · Spatial Perception</text>

  <text x="145" y="206" class="font-mono label">: </text>
  <text x="165" y="206" class="font-mono val">Agentic AI · Multi-Hop Knowledge Graphs</text>

  <text x="145" y="230" class="font-mono label">: </text>
  <text x="165" y="230" class="font-mono val">Sports Analytics · Real-Time Deep Learning</text>

  <text x="28" y="256" class="font-mono label">CURRENTLY</text>
  <text x="145" y="256" class="font-mono label">:</text>
  <text x="165" y="256" class="font-mono val" fill="#3B82F6" font-weight="700">BUILDING REAL-WORLD INTELLIGENT SYSTEMS</text>

  <text x="28" y="282" class="font-mono label">STATUS</text>
  <text x="145" y="282" class="font-mono label">:</text>
  <circle cx="172" cy="278" r="5" fill="#00FF9C" class="pulse-dot" filter="url(#glow)"/>
  <text x="185" y="282" class="font-mono" fill="#00FF9C" font-weight="700" font-size="13">ONLINE</text>
  <text x="250" y="282" class="font-mono" fill="#64748B" font-size="12">| LATENCY: 12ms | LOAD: OPTIMAL</text>

  <!-- Line End: Prompt with Blinking Cursor -->
  <text x="28" y="314" class="font-mono prompt">nilesh@github:~$</text>
  <rect x="175" y="301" width="9" height="16" fill="#00F5FF" class="cursor" filter="url(#glow)"/>
</svg>