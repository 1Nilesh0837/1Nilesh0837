  </filter>
  <linearGradient id="header-border" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00FF9F" stop-opacity="0.8"/>
    <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#1E3A5F" stop-opacity="0.8"/>
  </linearGradient>
</defs>
<rect width="810" height="68" rx="10" fill="#0A101F" stroke="url(#header-border)" stroke-width="1.2"/>
<circle cx="38" cy="34" r="18" fill="#0D1627" stroke="#1E3A5F" stroke-width="1"/>
