<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 68" width="100%" height="68" style="background:#0A101F; font-family:ui-monospace,'SF Mono','Cascadia Mono',Consolas,monospace;">
<defs>
  <filter id="green-glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="cyan-glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
