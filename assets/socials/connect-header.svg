<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 72" width="100%" height="72" style="background:#0A101F; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
<defs>
  <linearGradient id="rainbow-border" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#38BDF8"/>
    <stop offset="25%" stop-color="#FB923C"/>
    <stop offset="50%" stop-color="#00FF9F"/>
    <stop offset="75%" stop-color="#A855F7"/>
    <stop offset="100%" stop-color="#F43F5E"/>
  </linearGradient>
  <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur stdDeviation="2" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="810" height="72" rx="18" fill="#0A101F" stroke="url(#rainbow-border)" stroke-width="1.8"/>
<!-- Animated Waving Hand -->
<g transform="translate(24, 18)">
  <rect width="36" height="36" rx="10" fill="#131D31" stroke="#1E3A5F" stroke-width="1.2"/>
  <text x="18" y="25" font-size="20" text-anchor="middle">
    <animateTransform attributeName="transform" type="rotate" values="0 18 25; 18 18 25; -12 18 25; 18 18 25; 0 18 25" dur="1.8s" repeatCount="indefinite"/>
    👋
  </text>
</g>
<text x="74" y="32" fill="#FFFFFF" font-size="14.5" font-weight="800" letter-spacing="0.2">LET'S CONNECT &amp; SAY HELLO! <tspan fill="#F43F5E" font-size="14">✨</tspan></text>
<text x="74" y="52" fill="#94A3B8" font-size="10.5" font-weight="500">Drop by to chat about projects, open-source collabs, tech ideas or just say hi 💬</text>
<rect x="615" y="20.0" width="175" height="32" rx="16" fill="#0A2A1E" stroke="#10B981" stroke-width="1.2"/>
<circle cx="631" cy="36.0" r="4.5" fill="#00FF9F" filter="url(#soft-glow)">
  <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
</circle>
<text x="643" y="40.0" fill="#00FF9F" font-size="10" font-weight="800" letter-spacing="0.5">OPEN TO COLLAB 🚀</text>
</svg>
