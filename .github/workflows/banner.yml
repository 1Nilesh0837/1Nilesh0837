name: Generate Profile Banner

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/banner/**"
      - "assets/source/**"
      - ".github/workflows/banner.yml"

permissions:
  contents: write

jobs:
  banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/banner/requirements.txt

      - name: Pre-compute point data
        run: python scripts/banner/generate.py --precompute

      - name: Generate banners
        run: python scripts/banner/generate.py

      - name: Generate Pac-Man contribution grid
        run: python scripts/banner/generate_pacman.py

      - name: Generate Cyber Bento social cards
        run: python scripts/banner/generate_socials.py

      - name: Commit updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/banner-*.svg assets/github-pacman.svg assets/socials/ scripts/banner/data/ scripts/banner/logos/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: regenerate profile assets and social cards [skip ci]"
            git push
          fi
