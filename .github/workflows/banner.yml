name: Generate Profile Banner

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/banner/**"
      - "assets/source/**"
      - ".github/workflows/banner.yml"

permissions:
  contents: write

jobs:
  banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/banner/requirements.txt

      - name: Pre-compute point data
        run: python scripts/banner/generate.py --precompute

      - name: Generate banners
        run: python scripts/banner/generate.py

      - name: Generate Pac-Man contribution grid
        run: python scripts/banner/generate_pacman.py

      - name: Generate Cyber Bento social cards
        run: python scripts/banner/generate_socials.py

      - name: Generate Chrome Dino runner footer
        run: python scripts/banner/generate_dino.py

      - name: Generate Cyber Holographic GitHub Stats
        run: python scripts/banner/generate_stats.py

      - name: Generate Dark Cyber Bento Tech Matrix
        run: python scripts/banner/generate_tech_bento.py

      - name: Sync latest Featured Projects
        run: python scripts/banner/update_featured_projects.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/banner-*.svg assets/github-pacman.svg assets/footer-dino.svg assets/github-stats.svg assets/project-card-*.svg assets/tech-bento.svg assets/socials/ scripts/banner/data/ scripts/banner/logos/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: regenerate profile assets and sync featured projects [skip ci]"
            git push
          fi
